default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: kiln-check
        name: kiln check (포맷, 린트, 테스트, 새 주석)
        entry: bash -c 'PATH="$HOME/.cargo/bin:$PATH" cargo run -q --release -- check --staged'
        language: system
        pass_filenames: false
      - id: kiln-commit-msg
        name: 커밋 메시지 형식
        entry: bash -c 'PATH="$HOME/.cargo/bin:$PATH" cargo run -q --release -- commit-msg "$1"' --
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
