[package]
name = "kiln"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kihan-lee/kiln"

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
yaml-rust2 = "0.13.2"

[profile.release]
strip = true

[package.metadata.kiln]
comments = false
